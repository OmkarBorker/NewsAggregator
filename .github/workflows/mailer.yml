name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  TruffleHog:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --debug
          version: latest

      - name: Send email status (always)
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "TruffleHog Scan Result for ${{ github.repository }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Repo:      ${{ github.repository }}
            Event:     ${{ github.event_name }}
            Commit:    ${{ github.sha }}
            Status:
              - Trufflehog Outcome: ${{ steps.trufflehog.outcome }}
              - Success: ${{ steps.trufflehog.conclusion == 'success' }}
              - Failure: ${{ steps.trufflehog.conclusion == 'failure' }}

            Notes:
              This email was sent regardless of result.
